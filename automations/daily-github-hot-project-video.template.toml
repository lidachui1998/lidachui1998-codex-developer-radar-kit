version = 1
id = "daily-github-hot-project-video"
kind = "cron"
name = "Daily Developer Hot Topic Video"
prompt = "Use the local skill github-trending-douyin-video to create, validate, render, publish, and deploy a daily Douyin-ready vertical developer hot-topic video with natural Chinese voiceover. Work in <YOUR_PROJECT_DIR>. Fetch multi-source candidates from GitHub Trending, Hacker News, Product Hunt, and configured extra feeds such as Hugging Face, arXiv, or RSS when available. Select seven topics by default, focused on developer and AI projects that are easy to explain to a technical audience and likely to be popular; before finalizing topics, read data/topic-history.json and avoid any project or URL used in the last 7 days. If too few fresh GitHub projects remain, fill with Hacker News, Product Hunt, Hugging Face, arXiv, or RSS candidates instead of repeating recent topics. Rewrite angle, voiceover, and narration into concise conversational Chinese short-video copy; keep each topic voiceover tight, usually one sentence under about 45 Chinese characters. The first screen must be topic-first, using a clear headline such as 今日热门项目 or 今日 AI 开发者热点. Mention Codex generation only as secondary visual copy or later hook voiceover, not as the main first-frame headline. Do not show internal labels in the final video. End with a light CTA: 资料在公众号，回复 Codex 获取项目链接、脚本和自动化流程. For voice generation and rendering, run powershell -ExecutionPolicy Bypass -File scripts/render-with-voiceover.ps1. The script must run scripts/topic-history.mjs check --days 7 before rendering, use Edge Neural TTS voice zh-CN-YunxiNeural at rate -4% in per-segment chunks, measure segment durations into data/timings.json, rebuild HyperFrames scene timings from measured audio, record successful topics back into data/topic-history.json, extract a video thumbnail, and update site/public/data/days.json. Do not use Windows SAPI voices such as Microsoft Huihui Desktop, and do not use any fallback voice. If Edge Neural TTS is unavailable, fail the run instead of producing a wrong-voice video. Run lint and inspect, render the final MP4, mux the voiceover as an AAC audio stream if needed, and verify the final MP4 has both video and audio streams with matching durations using ffprobe. After rendering and validation, publish the final MP4 to Douyin automatically through the available authenticated Chrome or Douyin Creator Center uploader flow. If login, CAPTCHA, account selection, or another manual gate appears, ask the user to complete it and then continue from that session. During publishing, fill a concise Chinese title and description from the selected topics, keep the 回复 Codex resource CTA, and choose a few relevant Douyin hot-topic tags when the UI offers them; prefer truly matching popular topics over generic traffic tags. After clicking publish, verify the Creator Center or Works Management status. If the work is 审核中, report it as submitted for review and do not invent a public URL. If a public Douyin URL is visible, record it with node scripts/set-douyin-link.mjs YYYY-MM-DD <douyin-url>, then rerun node scripts/export-site-data.mjs and regenerate the WeChat article. After website data is updated, generate the WeChat public-account article draft for the same date with npm run wechat:generate -- YYYY-MM-DD. The WeChat article must be publish-ready, not a bare data list: include a hook, conclusion, each project's value, suitable audience, source link, and final resource CTA. Keep wechat/articles.json and site/public/data/wechat.json updated. If WeChat API credentials and thumb media ID are configured, npm run wechat:publish can create a draft or submit publishing, but the automation must not publish to WeChat automatically unless explicitly requested. Keep site/data/douyin-links.json as the source of Douyin links; if today's Douyin link is missing because the work is still under review or no public URL is visible, leave the website button pending instead of inventing a URL. Keep public-kit in sync with reusable scripts, sanitized templates, website data, WeChat publishing scripts, generated article drafts, the skill, and the automation template. Keep the public generation tutorial linked to <YOUR_REPO_URL> instead of local machine paths. Attempt Cloudflare Worker deployment with npm run site:deploy after every successful website data update; deploy when Wrangler has a valid login or CLOUDFLARE_API_TOKEN. If CLI deployment is blocked by Cloudflare authentication, report that clearly and include the local website data path or preview URL. Report source URLs, selected topics, output path, Douyin publish status and URL if available, audio stream verification, website data path, WeChat article draft path, WeChat publish readiness or blocker, deployed URL if deployed, public kit or GitHub sync status, preview URL if started, and validation warnings. Do not publish to WeChat automatically unless explicitly requested and the relevant account/API flow is available."
status = "ACTIVE"
rrule = "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR,SA,SU;BYHOUR=22;BYMINUTE=30;BYSECOND=0"
model = "gpt-5.5"
reasoning_effort = "xhigh"
execution_environment = "local"
cwds = ["<YOUR_PROJECT_DIR>"]
