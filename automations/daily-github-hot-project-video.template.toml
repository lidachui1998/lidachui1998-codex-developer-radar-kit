version = 1
id = "daily-github-hot-project-video"
kind = "cron"
name = "Daily Developer Hot Topic Video"
prompt = "Use the local skill github-trending-douyin-video to create a daily Douyin-ready vertical developer hot-topic video draft with natural Chinese voiceover, write the selected projects into the website data, keep the public reusable kit current, and deploy the Cloudflare Worker website when credentials are available. Work in <YOUR_PROJECT_DIR>. Fetch multi-source candidates from GitHub Trending, Hacker News, Product Hunt, and configured extra feeds such as Hugging Face, arXiv, or RSS when available. Select seven topics by default. Before finalizing topics, read data/topic-history.json and avoid any project or URL used in the last 7 days. Rewrite angle, voiceover, and narration into concise conversational Chinese short-video copy. The first screen must be topic-first, such as 今日热门项目 or 今日 AI 开发者热点. Mention Codex generation only as secondary visual copy or later hook voiceover. Do not show internal labels in the final video. End with a CTA asking viewers to comment Codex to get the script, prompt, and automation flow. For voice generation and rendering, run powershell -ExecutionPolicy Bypass -File scripts/render-with-voiceover.ps1. Use Edge Neural TTS voice zh-CN-YunxiNeural at rate -8%; do not use Windows SAPI fallback voices. If Edge Neural TTS is unavailable, fail the run instead of producing a wrong-voice video. After rendering, record topics in data/topic-history.json, update site/public/data/days.json, keep site/data/douyin-links.json as the source of Douyin links, and keep the public generation tutorial linked to <YOUR_REPO_URL> instead of local machine paths. Deploy the Cloudflare Worker site when credentials are available. Report source URLs, selected topics, output path, audio stream verification, website data path, deployed URL if deployed, public kit or GitHub sync status, and validation warnings. Do not publish to Douyin automatically."
status = "ACTIVE"
rrule = "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR,SA,SU;BYHOUR=22;BYMINUTE=30;BYSECOND=0"
model = "gpt-5.5"
reasoning_effort = "xhigh"
execution_environment = "local"
cwds = ["<YOUR_PROJECT_DIR>"]
